<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline | AssetVault SPIST</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#0a0d0b; }
    .offline-box { text-align:center; max-width:380px; padding:40px 30px; }
    .offline-icon { font-size:5rem; margin-bottom:20px; }
    h1 { color:#d4af37; font-size:1.8rem; margin-bottom:12px; }
    p  { color:#8d9a92; margin-bottom:24px; line-height:1.6; }
    .btn-gold { background:#d4af37; color:#0a0d0b; border:none; padding:12px 28px; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; }
    .btn-gold:hover { background:#e6c866; }
  </style>
</head>
<body>
  <div class="offline-box">
    <div class="offline-icon">📡</div>
    <h1>You're Offline</h1>
    <p>AssetVault SPIST needs an internet connection to load. Please check your connection and try again.</p>
    <button class="btn-gold" onclick="window.location.reload()">Try Again</button>
    <p style="margin-top:16px;font-size:.85rem;color:#555">Some pages may still be available from cache.</p>
  </div>
</body>
</html>
